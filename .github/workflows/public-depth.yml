name: Public source and synthetic gate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  public-gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate public source and synthetic behavior
        run: python scripts/release_check.py
